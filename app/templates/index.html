<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fake News Detector</title>

    <style>

        body{
            font-family: Arial;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container{
            width: 700px;
            background: #1f2937;
            padding: 30px;
            border-radius: 10px;
        }

        textarea{
            width: 100%;
            height: 250px;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button{
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #1d4ed8;
        }

        .result{
            margin-top: 20px;
            font-size: 24px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Fake News Detection</h1>

    <form method="POST">

        <textarea
            name="news"
            placeholder="Paste news article here..."
            required
        ></textarea>

        <button type="submit">
            Predict
        </button>

    </form>

    {% if prediction %}

        <div class="result">

            Prediction:
            <strong>{{ prediction }}</strong>

        </div>

    {% endif %}

</div>

</body>
</html>
